<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset your password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Duployan:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Sans Duployan", sans-serif;
            background: #D2B48C;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.5;
        }

        .email-container {
            max-width: 480px;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 48px 32px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(101, 67, 33, 0.3),
                0 0 0 1px rgba(205, 133, 63, 0.2);
        }

        .title {
            font-size: 28px;
            font-weight: 600;
            color: #654321;
            margin-bottom: 16px;
            letter-spacing: -0.025em;
        }

        .greeting {
            font-size: 16px;
            color: #8B7355;
            margin-bottom: 8px;
        }

        .description {
            font-size: 16px;
            color: #8B7355;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .company-name {
            color: #654321;
            font-weight: 500;
        }

        .reset-button {
            display: inline-block;
            background: #654321;
            color: #FFF8DC;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 16px;
            margin-bottom: 32px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(139, 69, 19, 0.2);
        }

        .reset-button:hover {
            background: linear-gradient(135deg, #654321 0%, #8B4513 100%);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(139, 69, 19, 0.3);
        }

        .alternative-text {
            font-size: 14px;
            color: #8B7355;
            margin-bottom: 8px;
        }

        .reset-link {
            font-size: 14px;
            color: #D2691E;
            word-break: break-all;
            text-decoration: none;
            margin-bottom: 24px;
            display: block;
        }

        .security-notice {
            font-size: 14px;
            color: #8B7355;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .signature {
            font-size: 14px;
            color: #8B7355;
            margin-bottom: 8px;
        }

        .team-name {
            font-size: 14px;
            color: #A0522D;
            font-style: italic;
        }

        /* Responsive design */
        @media (max-width: 600px) {
            .email-container {
                margin: 20px auto;
                padding: 32px 24px;
            }

            .title {
                font-size: 24px;
            }

            .reset-button {
                padding: 14px 28px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="email-container">
        <!-- Logo -->
        <div class="logo">
            <img src="${APP_LOGO}" alt="ExpenseWise Logo"
                 style="width: 250px; height: 60px; object-fit: contain; margin-bottom: 32px; display: block; margin-left: auto; margin-right: auto;">
        </div>

        <!-- Title -->
        <h1 class="title">Reset your password</h1>

        <!-- Content -->
        <p class="greeting">Hey there,</p>
        <p class="description">
            A request has been received to change the password for your <span class="company-name">ExpenseWise</span> account.
        </p>

        <!-- Reset Button -->
        <a href="${RESET_LINK}" class="reset-button">Reset Password</a>

        <!-- Alternative link -->
        <p class="alternative-text">If the link doesn't work, paste this link to your browser:</p>
        <a href="${RESET_LINK}" class="reset-link">${RESET_LINK}</a>

        <!-- Security notice -->
        <p class="security-notice">
            If you didn't request a password change, ignore this email.
        </p>

        <!-- Signature -->
        <p class="signature">Thank you,</p>
        <p class="team-name">ExpenseWise Team</p>
    </div>
</body>
</html>
