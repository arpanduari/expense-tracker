<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset your password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #D2B48C;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.5;
        }

        .email-container {
            max-width: 480px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 24px;
            padding: 48px 32px;
            text-align: center;
            border: 1px solid #cd853f;
        }

        .title {
            font-size: 28px;
            font-weight: 600;
            color: #654321;
            margin-bottom: 16px;
        }

        .greeting {
            font-size: 16px;
            color: #8B7355;
            margin-bottom: 8px;
        }

        .description {
            font-size: 16px;
            color: #8B7355;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .company-name {
            color: #654321;
            font-weight: 500;
        }

        .reset-button {
            display: inline-block;
            background-color: #654321 !important;
            color: #FFF8DC !important;
            text-decoration: none !important;
            padding: 16px 32px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 16px;
            margin-bottom: 32px;
            border: none;
        }

        .reset-button:hover {
            background-color: #8B4513 !important;
        }

        .alternative-text {
            font-size: 14px;
            color: #8B7355;
            margin-bottom: 8px;
        }

        .reset-link {
            font-size: 14px;
            color: #D2691E;
            word-break: break-all;
            text-decoration: none;
            margin-bottom: 24px;
            display: block;
        }

        .security-notice {
            font-size: 14px;
            color: #8B7355;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .signature {
            font-size: 14px;
            color: #8B7355;
            margin-bottom: 8px;
        }

        .team-name {
            font-size: 14px;
            color: #A0522D;
            font-style: italic;
        }

        /* Responsive design */
        @media (max-width: 600px) {
            .email-container {
                margin: 20px auto;
                padding: 32px 24px;
            }

            .title {
                font-size: 24px;
            }

            .reset-button {
                padding: 14px 28px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="email-container">
        <!-- Logo -->
        <div style="margin-bottom: 32px;">
            <img src="${APP_LOGO}" alt="ExpenseWise Logo"
                 style="width: 250px; height: 60px; object-fit: contain; display: block; margin: 0 auto;">
        </div>

        <!-- Title -->
        <h1 class="title">Reset your password</h1>

        <!-- Content -->
        <p class="greeting">Hey there,</p>
        <p class="description">
            A request has been received to change the password for your <span class="company-name">ExpenseWise</span> account.
        </p>

        <!-- Reset Button with table-based approach for email compatibility -->
        <table cellpadding="0" cellspacing="0" border="0" style="margin: 0 auto 32px;">
            <tr>
                <td style="background-color: #654321; border-radius: 12px; padding: 16px 32px;">
                    <a href="${RESET_LINK}" style="color: #FFF8DC; text-decoration: none; font-weight: 500; font-size: 16px; display: block;">
                        Reset Password
                    </a>
                </td>
            </tr>
        </table>

        <!-- Alternative link -->
        <p class="alternative-text">If the link doesn't work, paste this link to your browser:</p>
        <a href="${RESET_LINK}" class="reset-link">${RESET_LINK}</a>

        <!-- Security notice -->
        <p class="security-notice">
            If you didn't request a password change, ignore this email.
        </p>

        <!-- Signature -->
        <p class="signature">Thank you,</p>
        <p class="team-name">ExpenseWise Team</p>
    </div>
</body>
</html>
